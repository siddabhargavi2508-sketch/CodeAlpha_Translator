<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Language Translator</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
<header>
<div>
<h1>Language Translator</h1>
<p>Translate text between languages easily.</p>
</div>
<button type="button" id="historyPageButton" class="history-btn">Translator History</button>
</header>
<section id="translatorPage">
<div class="translator">
<div class="language-selection">
<div class="language-box">
<label for="sourceLanguage">Translate from</label>
<select id="sourceLanguage">
<option value="en">English</option>
<option value="te">Telugu</option>
<option value="hi">Hindi</option>
<option value="ta">Tamil</option>
<option value="kn">Kannada</option>
<option value="ml">Malayalam</option>
<option value="fr">French</option>
<option value="de">German</option>
<option value="es">Spanish</option>
<option value="it">Italian</option>
<option value="ja">Japanese</option>
<option value="ko">Korean</option>
<option value="zh-CN">Chinese</option>
<option value="ar">Arabic</option>
<option value="pt">Portuguese</option>
<option value="ru">Russian</option>
</select>
</div>
<button type="button" id="swapButton" class="swap-btn" title="Swap languages">⇄</button>
<div class="language-box">
<label for="targetLanguage">Translate to</label>
<select id="targetLanguage">
<option value="te">Telugu</option>
<option value="en">English</option>
<option value="hi">Hindi</option>
<option value="ta">Tamil</option>
<option value="kn">Kannada</option>
<option value="ml">Malayalam</option>
<option value="fr">French</option>
<option value="de">German</option>
<option value="es">Spanish</option>
<option value="it">Italian</option>
<option value="ja">Japanese</option>
<option value="ko">Korean</option>
<option value="zh-CN">Chinese</option>
<option value="ar">Arabic</option>
<option value="pt">Portuguese</option>
<option value="ru">Russian</option>
</select>
</div>
</div>
<div class="text-areas">
<div class="text-box">
<label for="inputText">Enter your text</label>
<textarea id="inputText" maxlength="450" placeholder="Type or paste your text here..."></textarea>
<div class="text-actions">
<span id="charCount">0 / 450</span>
<button type="button" id="clearButton">Clear</button>
</div>
</div>
<div class="text-box">
<label for="outputText">Translation</label>
<textarea id="outputText" placeholder="Your translation will appear here..." readonly></textarea>
<div class="text-actions">
<span id="statusMessage">Ready to translate</span>
<button type="button" id="copyButton">Copy</button>
</div>
</div>
</div>
<button type="button" id="translateButton" class="translate-btn">Translate Text</button>
<p id="message" class="message" role="status" aria-live="polite"></p>
<p class="note">Machine translations may contain mistakes. Verify important translations.</p>
</div>
</section>
<section id="historyPage" hidden>
<div class="history-heading">
<h2>Translator History</h2>
<div class="history-controls">
<button type="button" id="translatorPageButton" class="back-btn">Back to Translator</button>
<button type="button" id="clearHistoryButton" class="delete-all-btn">Clear All</button>
</div>
</div>
<div id="historyList"></div>
</section>
<footer>Language Translator · HTML · CSS · JavaScript</footer>
</div>
<script src="script.js"></script>
</body>
</html>
